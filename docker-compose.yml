services:
  # ─── Base de Datos ───
  postgres:
    image: postgres:16-alpine
    container_name: perfume_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Broker Celery + Cache) ───
  redis:
    image: redis:7-alpine
    container_name: perfume_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ─── Backend FastAPI ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perfume_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Celery Worker ───
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perfume_celery
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app worker --loglevel=info

  # ─── Celery Beat (tareas programadas) ───
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perfume_celery_beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.core.celery_app beat --loglevel=info

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: perfume_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # ─── Frontend Next.js ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: perfume_frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  postgres_data:
  redis_data: