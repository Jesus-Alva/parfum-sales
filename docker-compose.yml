services:
  postgres:
    image: postgres:16-alpine
    container_name: scentia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - scentia_net

  redis:
    image: redis:7-alpine
    container_name: scentia_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scentia_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scentia_backend
    restart: always
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    networks:
      - scentia_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scentia_celery
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - backend
    volumes:
      - ./backend:/app
    networks:
      - scentia_net

  nginx:
    image: nginx:alpine
    container_name: scentia_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - scentia_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scentia_frontend
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - scentia_net

volumes:
  postgres_data:
  redis_data:

networks:
  scentia_net:
    driver: bridge